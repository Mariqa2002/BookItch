<style>.bk-btn{font:600 13px/16px var(--font-sans);display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-5);border-radius:var(--radius-pill);border:0;cursor:pointer}
.bk-btn:focus-visible,.bk-chip:focus-visible,.bk-tab:focus-visible,.bk-nav:focus-visible,.bk-input:focus-visible,.bk-search input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bk-btn--primary{background:var(--primary);color:var(--on-primary)}
.bk-btn--deep{background:var(--primary-deep);color:var(--on-primary-deep)}
.bk-btn--soft{background:var(--tint-strong);color:var(--ink)}
.bk-btn--ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--border-strong)}
.bk-btn:disabled{opacity:.5;cursor:not-allowed}
.bk-badge{font:600 11px/16px var(--font-sans);display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-3);border-radius:var(--radius-pill)}
.bk-badge--reading{background:var(--reading-bg);color:var(--reading-ink)}
.bk-badge--completed{background:var(--success-bg);color:var(--success-ink)}
.bk-badge--want{background:var(--want-bg);color:var(--want-ink)}
.bk-progress{display:flex;align-items:center;gap:var(--space-3);font:400 12px/18px var(--font-sans);color:var(--ink-muted)}
.bk-progress__track{flex:1;height:6px;border-radius:var(--radius-pill);background:var(--tint-strong);overflow:hidden}
.bk-progress__fill{height:100%;border-radius:var(--radius-pill);background:var(--primary-deep)}
.bk-search{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);background:var(--surface);border-radius:var(--radius-pill);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--ink-muted)}
.bk-search input{flex:1;border:0;background:transparent;font:400 13px/18px var(--font-sans);color:var(--ink);outline:0}
.bk-search:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.bk-search input::placeholder{color:var(--ink-muted)}
.bk-chip{font:600 12px/16px var(--font-sans);padding:var(--space-2) var(--space-4);border-radius:var(--radius-pill);border:0;background:var(--tint-strong);color:var(--ink);cursor:pointer}
.bk-chip[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
.bk-tabs{display:flex;gap:var(--space-6);border-bottom:1px solid var(--border)}
.bk-tab{font:600 13px/18px var(--font-sans);padding:var(--space-3) 0;border:0;background:transparent;color:var(--ink-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.bk-tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--primary-deep)}
.bk-nav{display:flex;align-items:center;gap:var(--space-3);width:100%;padding:var(--space-3) var(--space-4);border:0;border-radius:var(--radius-pill);background:transparent;color:var(--on-plum-muted);font:600 14px/20px var(--font-sans);cursor:pointer;text-align:left}
.bk-nav--active{background:var(--violet-300);color:var(--on-violet-300)}
.bk-side{background:var(--plum);padding:var(--space-5) var(--space-4);border-radius:var(--radius-xl);width:196px;display:flex;flex-direction:column;gap:var(--space-1)}
.bk-side__brand{font:700 28px/32px var(--font-sans);color:var(--on-plum);padding:0 var(--space-4) var(--space-5)}
.bk-side__sign{font:500 22px/26px var(--font-script);color:var(--on-plum-muted);padding:var(--space-6) var(--space-4) 0}
.bk-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--space-4);min-width:150px}
.bk-stat__n{font:700 24px/30px var(--font-sans);color:var(--ink)}
.bk-stat__l{font:400 12px/18px var(--font-sans);color:var(--ink-muted)}
.bk-card{display:flex;flex-direction:column;gap:var(--space-2);width:132px;font-family:var(--font-sans)}
.bk-cover{height:168px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:var(--space-3);box-shadow:var(--shadow-card);font:700 17px/20px var(--font-sans)}
.bk-cover--butter{background:var(--note);color:var(--ink)}
.bk-cover--sage{background:var(--success-ink);color:#fff}
.bk-cover--plum{background:var(--plum);color:var(--on-plum)}
.bk-cover--rust{background:var(--rust);color:#fff}
.bk-card__t{font:600 12px/16px var(--font-sans);color:var(--ink)}
.bk-card__a{font:400 11px/16px var(--font-sans);color:var(--ink-muted)}
.bk-chap{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border);font-family:var(--font-sans);color:var(--ink)}
.bk-chap--current{background:var(--tint)}
.bk-chap__main{flex:1}
.bk-chap__t{font:600 13px/18px var(--font-sans)}
.bk-chap__s{font:400 11px/16px var(--font-sans);color:var(--ink-muted)}
.bk-dot{width:18px;height:18px;border-radius:var(--radius-pill);box-shadow:inset 0 0 0 1.5px var(--border-strong);display:inline-flex;align-items:center;justify-content:center;flex:none}
.bk-dot--done{background:var(--success-ink);box-shadow:none;color:#fff}
.bk-sticky{background:var(--note);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:var(--shadow-card);width:260px;color:var(--ink)}
.bk-sticky__t{font:500 22px/26px var(--font-script);margin-bottom:var(--space-3)}
.bk-sticky ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-3)}
.bk-sticky li{display:flex;align-items:center;gap:var(--space-3);font:400 13px/18px var(--font-sans)}
.bk-sticky__f{font:500 22px/26px var(--font-script);margin-top:var(--space-4)}
.bk-quote{background:var(--tint);border-radius:var(--radius-xl);padding:var(--space-6);width:300px;color:var(--ink)}
.bk-quote__q{font:500 22px/28px var(--font-script);margin:0}
.bk-quote__a{font:400 12px/18px var(--font-sans);color:var(--ink-muted);margin-top:var(--space-3)}
.bk-note{display:flex;gap:var(--space-3);width:380px}
.bk-input{flex:1;padding:var(--space-3) var(--space-4);border-radius:var(--radius-sm);border:0;box-shadow:inset 0 0 0 1px var(--border-strong);background:var(--surface);color:var(--ink);font:400 13px/18px var(--font-sans)}
.bk-input::placeholder{color:var(--ink-muted)}
.bk-toggle{display:inline-flex;padding:3px;border-radius:var(--radius-pill);background:var(--tint-strong);gap:2px}
.bk-toggle button{width:32px;height:32px;border:0;border-radius:var(--radius-pill);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.bk-toggle button[aria-pressed=true]{background:var(--primary-deep);color:var(--on-primary-deep)}
.bk-toggle button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
