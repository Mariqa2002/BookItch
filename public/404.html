<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Book Itch</title>
    <!--
      GitHub Pages has no server-side rewrites, so a direct load or
      refresh of a route like /BookItch/books/abc serves this 404 page
      instead of index.html. This repacks the real path into a query
      string and redirects to the app root, where the matching script in
      index.html unpacks it with history.replaceState before React (and
      react-router) ever sees the URL. Standard trick, see
      https://github.com/rafgraph/spa-github-pages — pathSegmentsToKeep
      is 1 here for the '/BookItch' repo-name segment.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
